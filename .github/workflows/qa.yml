name: Petal Realms QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and public-key safety
        run: node tests/js_syntax.cjs
      - name: Cloud save mock regression
        run: node tests/cloud_unit.cjs
      - name: Auth error guidance regression
        run: node tests/auth_error_guidance.cjs
      - name: Talent progression and shrine regression
        run: node tests/talents_v56.cjs
      - name: V5.7 tactical gameplay regression
        run: node tests/tactical_v57.cjs
      - name: V5.7 Realtime protocol regression
        run: node tests/realtime_v57.cjs
      - name: Cloudflare Pages callback and headers regression
        run: node tests/cloudflare_pages.cjs
      - name: V5.9 creature geometry, inventory and verified signup
        run: node tests/v59_gameplay_auth.cjs
  browser-v59:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium for interaction regression
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Desktop/mobile V5.9 UI and runtime browser checks
        run: python tests/browser_v59.py
      - name: Upload desktop/mobile inventory screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v59-inventory-crafting-screenshots
          path: artifacts/qa/v59_*.png
          if-no-files-found: ignore
