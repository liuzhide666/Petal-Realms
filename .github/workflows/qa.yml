name: Petal Realms QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Versioned probability rules
        run: |
          node scripts/build-rules.cjs --check
          node tests/v514_probability.cjs
          node tests/v515_rules.cjs
          node tests/v516_workshop.cjs
          node tests/v518_field.cjs
          node tests/standard_catalog.cjs
      - name: Syntax and public-key safety
        run: node tests/js_syntax.cjs
      - name: Cloud save mock regression
        run: node tests/cloud_unit.cjs
      - name: Auth error guidance regression
        run: node tests/auth_error_guidance.cjs
      - name: Talent progression and shrine regression
        run: node tests/talents_v56.cjs
      - name: V5.7 tactical gameplay regression
        run: node tests/tactical_v57.cjs
      - name: V5.7 Realtime protocol regression
        run: node tests/realtime_v57.cjs
      - name: Cloudflare Pages callback and headers regression
        run: node tests/cloudflare_pages.cjs
      - name: V5.9 creature geometry, inventory and verified signup
        run: node tests/v59_gameplay_auth.cjs
      - name: V5.9.1 bounded bulk crafting regression
        run: node tests/v591_batch_craft.cjs
      - name: V5.9.2 exact collision geometry regression
        run: node tests/v592_collision_precision.cjs
      - name: V5.10 account availability, backups and petal workbench
        run: |
          node tests/v510_access.cjs
          node tests/v510_backups.cjs
          node tests/v510_petals.cjs
      - name: V5.9.3 petal protection and collision broadphase
        run: node tests/v593_protection_broadphase.cjs
      - name: Cloudflare account API and frontend wiring
        run: |
          node tests/v511_wiring.cjs
          node --test tests/v511_combat.cjs
          node --test tests/v511_review.cjs
          node --test tests/cloudflare_api.test.mjs
      - name: Input, collection and neutral creature behavior
        run: node tests/v512_controls_collection.cjs
      - name: Bounded save retries and preserved outbox
        run: node tests/v519_sync_retry.cjs
      - name: Recovery, settled crafting, deterministic effects and training contracts
        run: |
          node tests/v520_recovery.cjs
          node tests/v520_crafting.cjs
          node tests/v520_capacity.cjs
          node tests/v520_skills.cjs
          node tests/v520_effects.cjs
          node tests/v520_trials.cjs
          node tests/save_store.cjs
          node tests/save_integration.cjs
          node tests/v521_release_guards.cjs
          node tests/manual_integrity.cjs
          node tests/probability_independent.cjs
          node tests/probability_catalog.cjs
  browser-v59:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Cloudflare local runtime
        run: npm ci
      - name: Install Playwright and Chromium for interaction regression
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Desktop/mobile interaction and runtime browser checks
        run: |
          python tests/browser_v59.py
          python tests/browser_v510.py
          python tests/browser_v511.py
          python tests/browser_v512.py
          python tests/browser_v513_visual.py
          python tests/browser_v514.py
          python tests/browser_v515.py
          npm install --no-save --package-lock=false playwright@1.58.0
          node tests/browser_v516.mjs
          node tests/browser_v517.mjs
          node tests/browser_v518.mjs
          node tests/browser_input_continuity.mjs
          node tests/browser_v519.mjs
          node tests/browser_v520.mjs
          node tests/browser_v520_trials.mjs
          node tests/browser_save_craft.mjs
      - name: Upload browser screenshots and assertion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v59-inventory-crafting-screenshots
          path: |
            artifacts/qa/*.png
            artifacts/qa/*_results.json
            artifacts/qa/*_browser.json
            artifacts/qa/input_continuity.json
          if-no-files-found: ignore
