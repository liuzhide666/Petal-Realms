name: Petal Realms QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and public-key safety
        run: node tests/js_syntax.cjs
      - name: Cloud save mock regression
        run: node tests/cloud_unit.cjs
