# Keep the source, SQL migrations and tests out of the published site.
[build]
  publish = "site"
  # Cloudflare is the sole release target. Skip future legacy Netlify builds.
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
